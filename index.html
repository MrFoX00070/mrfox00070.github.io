<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="refresh" content="1;url=ja/">
  <title>MrFoX00070</title>
  <script>
    try {
      const language = localStorage.getItem('mrfox-language');
      if (language === 'en') location.replace('en/');
      else location.replace('ja/');
    } catch (error) { location.replace('ja/'); }
  </script>
</head>
<body><p><a href="ja/">日本語</a> / <a href="en/">English</a></p></body>
</html>
